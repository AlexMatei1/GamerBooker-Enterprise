# ==============================================================================
# GamerBooker Enterprise v1.0 — Global Edge Gateway Configuration
# Reverse Proxy routing for API, Venue Dashboard, and Mobile App
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Upstream services
    upstream backend_api {
        server backend:3000;
        keepalive 32;
    }

    upstream venue_dashboard {
        server venue-dashboard:80;
    }

    upstream mobile_app {
        server mobile-app:80;
    }

    # Main HTTP Server
    server {
        listen 80;
        server_name localhost *.localhost;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Health endpoint
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"gamerbooker-gateway"}';
            add_header Content-Type application/json;
        }

        # Backend REST API & OpenAPI Swagger Docs
        location /v1/ {
            proxy_pass http://backend_api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs/ {
            proxy_pass http://backend_api/docs/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Enterprise Venue Dashboard
        location /dashboard/ {
            proxy_pass http://venue_dashboard/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Customer Mobile Web App (Root Default)
        location / {
            proxy_pass http://mobile_app/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
